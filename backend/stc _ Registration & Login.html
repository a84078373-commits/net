<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>stc | Registration</title>
<style>
:root{--bg1:#fff;--bg2:#fff;--card:#fff;--text:#1f1b24;--muted:#8a8392;--field:#f7f4fb;--line:#e6e0ec;--brand:#4f008c;--accent:#8b2fc9;--ok:#0a7d52;--err:#d02348;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#140a20;--bg2:#2a1245;--card:#1f1230;--text:#f3ecfa;--muted:#a898ba;--field:#2b1a41;--line:#3b2756;--ok:#4cd39a;--err:#ff6f8a;color-scheme:dark}}
:root[data-theme="dark"]{--bg1:#140a20;--bg2:#2a1245;--card:#1f1230;--text:#f3ecfa;--muted:#a898ba;--field:#2b1a41;--line:#3b2756;--ok:#4cd39a;--err:#ff6f8a;color-scheme:dark}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;padding:16px;display:grid;place-items:center;background:linear-gradient(135deg,var(--bg1),var(--bg2));color:var(--text);font-family:"Helvetica Neue",Helvetica,Arial,"Liberation Sans",sans-serif}
.ic{width:20px;height:20px;fill:currentColor;flex:none}
.wrap{display:block}
.stage{position:relative;width:760px;height:500px}
.card{position:absolute;left:0;top:0;width:760px;height:500px;transform-origin:0 0;background:var(--card);border-radius:30px;overflow:hidden;box-shadow:0 20px 50px rgba(79,0,140,.16)}
.box{position:absolute;top:0;width:50%;height:100%;padding:0 44px;display:flex;flex-direction:column;justify-content:center;transition:opacity .4s,transform .6s cubic-bezier(.7,0,.2,1)}
.f-reg{left:0}
.f-log{left:50%;opacity:0;transform:translateX(12%)}
.card.login .f-reg{opacity:0;transform:translateX(-12%)}
.card.login .f-log{opacity:1;transform:none}
h1{text-align:center;font-size:30px;font-weight:700;margin:0 0 24px}
.field{display:flex;align-items:center;gap:10px;height:48px;margin-bottom:18px;padding:0 16px 0 18px;background:var(--field);border:1.5px solid transparent;border-radius:10px;transition:border-color .2s}
.field:focus-within{border-color:var(--brand)}
.field input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--text);font:16px "Helvetica Neue",Helvetica,Arial,sans-serif}
.field input::placeholder{color:var(--muted)}
.btn{width:100%;height:48px;margin-top:4px;border:0;border-radius:999px;color:#fff;font:700 17px Arial,sans-serif;cursor:pointer;background:linear-gradient(90deg,#33005c,var(--brand) 45%,#8b2fc9)}
.btn:hover{filter:brightness(1.1)}
.btn:focus-visible,.soc button:focus-visible,.ghost:focus-visible,.forgot:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.msg{min-height:20px;margin:8px 0 0;font-size:13px;text-align:center}
.msg.err{color:var(--err)}.msg.ok{color:var(--ok)}
.or{text-align:center;color:var(--muted);font-size:14px;margin:6px 0 14px}
.soc{display:flex;justify-content:center;gap:14px}
.soc button{width:50px;height:50px;display:grid;place-items:center;border:1px solid var(--line);border-radius:4px;background:var(--card);color:var(--text);font:700 22px Arial,sans-serif;cursor:pointer}
.soc button:hover{border-color:var(--brand)}
.soc .ic{width:26px;height:26px}
.forgot{align-self:flex-end;margin:-10px 2px 18px;border:0;background:none;padding:0;color:var(--muted);font:14px Arial,sans-serif;cursor:pointer}
.forgot:hover{color:var(--brand)}
.eye{border:0;background:none;padding:0;color:var(--muted);display:flex;cursor:pointer}
.eye:hover{color:var(--text)}
.eye:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pw{margin:-8px 2px 14px}
.f-reg h1{margin-bottom:18px}
.f-reg .field{margin-bottom:16px}
.bar{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--err);transition:width .25s,background .25s}
.rules{list-style:none;margin:8px 0 0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;font:12px Arial,sans-serif;color:var(--muted)}
.rules li::before{content:"○ "}
.rules li.ok{color:var(--ok)}
.rules li.ok::before{content:"✓ "}
.f-otp{left:0;opacity:0;pointer-events:none}
.card.login .f-otp{left:50%}
.card.otp .f-reg,.card.otp .f-log{opacity:0;pointer-events:none}
.card.otp .f-otp{opacity:1;pointer-events:auto}
.f-otp h1{margin-bottom:12px}
.otp-sub{text-align:center;color:var(--muted);font-size:14px;line-height:1.5;margin:0 0 22px}
.otp-sub b{color:var(--text);font-weight:600;word-break:break-all}
.hint{text-align:center;color:var(--muted);font-size:12px;margin:-14px 0 20px}
.otp-row{display:flex;justify-content:center;gap:8px;direction:ltr;margin-bottom:20px}
.otp-row input{width:42px;height:52px;padding:0;text-align:center;font:700 22px Arial,sans-serif;color:var(--text);background:var(--field);border:1.5px solid transparent;border-radius:10px;outline:0;transition:border-color .2s}
.otp-row input:focus{border-color:var(--accent)}
.lnk{align-self:center;margin:4px 0;border:0;background:none;color:var(--text);font:700 14px Arial,sans-serif;text-decoration:underline;cursor:pointer}
.lnk:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.overlay{position:absolute;top:0;left:0;width:50%;height:100%;display:grid;place-items:center;text-align:center;color:#fff;padding:0 40px;background:linear-gradient(155deg,#5e12a3,var(--brand) 40%,#26003f);border-radius:100px 0 0 100px;transform:translateX(100%);transition:transform .6s cubic-bezier(.7,0,.2,1),border-radius .6s}
.card.login .overlay{transform:none;border-radius:0 100px 100px 0}
.ov{grid-area:1/1;transition:opacity .4s}
.ov.o-log{opacity:0}
.card.login .o-log{opacity:1}.card.login .o-reg{opacity:0}
.logo{font-weight:800;font-size:30px;letter-spacing:-1px;line-height:1;margin:0 0 24px;color:#fff}
.logo i{font-style:normal;color:var(--accent)}
.logo-img{display:block;width:150px;height:auto;margin:0 auto 24px}
.ov h2{font-size:34px;font-weight:700;margin:0 0 8px}
.ov p.sub{margin:0 0 20px;font-size:16px}
.ghost{width:160px;height:46px;border-radius:999px;background:transparent;border:2px solid #fff;color:#fff;font:700 16px Arial,sans-serif;cursor:pointer}
.ghost:hover{background:rgba(255,255,255,.14)}
.rot{display:none;margin:12px 0 0;text-align:center;color:var(--muted);font:13px Arial,sans-serif}
@media (orientation:portrait) and (max-width:760px){.rot{display:block}}
@media (prefers-reduced-motion:reduce){.box,.overlay,.ov{transition:none}}
</style>
</head>
<body>

<div class="wrap"><div class="stage" id="stage"><main class="card" id="card">

 <form class="box f-reg" data-kind="reg" novalidate>
  <h1>Registration</h1>
  <label class="field"><input name="username" autocomplete="username" placeholder="Username" aria-label="Username"><svg class="ic"><use href="#i-user"/></svg></label>
  <label class="field"><input name="email" type="email" autocomplete="email" placeholder="Email" aria-label="Email"><svg class="ic"><use href="#i-mail"/></svg></label>
  <label class="field"><input name="phone" type="tel" inputmode="numeric" autocomplete="tel" placeholder="Mobile number (05xxxxxxxx)" aria-label="Mobile number"><svg class="ic"><use href="#i-phone"/></svg></label>
  <label class="field"><input name="password" type="password" autocomplete="new-password" placeholder="Password" aria-label="Password"><button type="button" class="eye" aria-label="Show password"><svg class="ic"><use href="#i-eye"/></svg></button><svg class="ic"><use href="#i-lock"/></svg></label>
  <div class="pw" aria-live="polite">
   <div class="bar"><i></i></div>
   <ul class="rules"><li data-r="len">8+ characters</li><li data-r="up">Uppercase letter</li><li data-r="num">Number</li><li data-r="sym">Symbol</li></ul>
  </div>
  <button class="btn" type="submit">Register</button>
  <p class="msg" role="status"></p>
 </form>

 <form class="box f-log" data-kind="log" novalidate inert>
  <h1>Login</h1>
  <label class="field"><input name="username" autocomplete="username" placeholder="Username" aria-label="Username"><svg class="ic"><use href="#i-user"/></svg></label>
  <label class="field"><input name="password" type="password" autocomplete="current-password" placeholder="Password" aria-label="Password"><button type="button" class="eye" aria-label="Show password"><svg class="ic"><use href="#i-eye"/></svg></button><svg class="ic"><use href="#i-lock"/></svg></label>
  <button type="button" class="forgot">Forgot password?</button>
  <button class="btn" type="submit">Login</button>
  <p class="msg" role="status"></p>
 </form>

 <form class="box f-otp" novalidate inert>
  <h1>Verification</h1>
  <p class="otp-sub">Enter the 6-digit code sent by SMS to <b class="to"></b></p>
  <p class="hint">Demo code: 123456</p>
  <div class="otp-row" role="group" aria-label="Verification code"></div>
  <button class="btn" type="submit">Verify</button>
  <p class="msg" role="status"></p>
  <p class="or">Resend code in <span class="cd">30</span>s</p>
  <button type="button" class="lnk resend" hidden>Resend code</button>
  <button type="button" class="lnk back">Back</button>
 </form>

 <aside class="overlay">
  <div class="ov o-reg">
   <img class="logo-img" alt="stc">
   <h2>Welcome Back!</h2>
   <p class="sub">Already have an Account</p>
   <button type="button" class="ghost" data-go="login">Login</button>
  </div>
  <div class="ov o-log" inert>
   <img class="logo-img" alt="stc">
   <h2>Hello, Welcome!</h2>
   <p class="sub">Don’t have an Account</p>
   <button type="button" class="ghost" data-go="register">Register</button>
  </div>
 </aside>

</main></div>
<p class="rot">Rotate your phone for a larger view</p></div>

document.querySelectorAll('.logo-img').forEach(i=>{i.src=LOGO});
const q=s=>card.querySelector(s);let tick;
function show(){
 const l=location.hash==='#login';
 clearInterval(tick);card.classList.remove('otp');card.classList.toggle('login',l);q('.f-otp').inert=true;
 q('.f-reg').inert=l;q('.f-log').inert=!l;
 q('.o-reg').inert=l;q('.o-log').inert=!l;
 document.title=l?'stc | Login':'stc | Registration';
}
addEventListener('hashchange',show);show();
const stage=document.getElementById('stage');
function fit(){
 if(document.activeElement&&document.activeElement.tagName==='INPUT')return;
 const port=matchMedia('(orientation:portrait) and (max-width:760px)').matches;
 const s=Math.min(1.25,(innerWidth-32)/760,(innerHeight-(port?80:32))/500);
 card.style.transform='scale('+s+')';
 stage.style.width=760*s+'px';stage.style.height=500*s+'px';
}
addEventListener('resize',fit);fit();
document.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>{location.hash=b.dataset.go}));
document.querySelectorAll('form[data-kind]').forEach(f=>f.addEventListener('submit',e=>{
 e.preventDefault();
 const d=Object.fromEntries(new FormData(f)),reg=f.dataset.kind==='reg';
 let err='';
 if(!d.username.trim())err='Enter your username';
 else if(reg&&!/^\S+@\S+\.\S+$/.test(d.email))err='Enter a valid email address';
 else if(reg&&!/^05\d{8}$/.test(d.phone))err='Enter a valid mobile number (05xxxxxxxx)';
 else if(reg&&!Object.values(rules).every(f=>f(d.password)))err='Password doesn’t meet all the requirements';
 else if(!reg&&!d.password)err='Enter your password';
 const m=f.querySelector('.msg');
 m.className='msg '+(err?'err':'ok');
 m.textContent=err;
 if(!err){m.textContent='';startOtp(reg,reg?d.phone.replace(/^(\d{2})\d+(\d{2})$/,'$1••••••$2'):'your registered mobile number')}
}));

document.querySelectorAll('.eye').forEach(b=>b.addEventListener('click',()=>{
 const i=b.parentElement.querySelector('input'),on=i.type==='password';
 i.type=on?'text':'password';
 b.setAttribute('aria-label',on?'Hide password':'Show password');
 b.querySelector('use').setAttribute('href',on?'#i-eyeoff':'#i-eye');
}));
const rules={len:v=>v.length>=8,up:v=>/[A-Z]/.test(v),num:v=>/\d/.test(v),sym:v=>/[^A-Za-z0-9]/.test(v)};
const pwIn=q('.f-reg input[name=password]'),pwBox=q('.pw');
pwIn.addEventListener('input',()=>{
 let n=0;
 pwBox.querySelectorAll('li').forEach(li=>{const ok=rules[li.dataset.r](pwIn.value);li.classList.toggle('ok',ok);if(ok)n++});
 const bar=pwBox.querySelector('i');
 bar.style.width=n*25+'%';
 bar.style.background=n<=1?'var(--err)':n===2?'#e8a317':'var(--ok)';
});
const toLat=s=>s.replace(/[\u0660-\u0669]/g,c=>c.charCodeAt(0)-1632);
const phIn=q('.f-reg input[name=phone]');
phIn.addEventListener('input',()=>{phIn.value=toLat(phIn.value).replace(/\D/g,'').slice(0,10)});
const oForm=q('.f-otp'),row=oForm.querySelector('.otp-row'),om=oForm.querySelector('.msg'),cd=oForm.querySelector('.cd'),rs=oForm.querySelector('.resend');
row.innerHTML=Array.from({length:6},(_,i)=>'<input inputmode="numeric" maxlength="1" aria-label="Digit '+(i+1)+'"'+(i?'':' autocomplete="one-time-code"')+'>').join('');
const bx=[...row.children];let mode='reg';
function count(){
 let n=30;rs.hidden=true;cd.parentElement.hidden=false;cd.textContent=n;clearInterval(tick);
 tick=setInterval(()=>{n--;cd.textContent=n;if(n<=0){clearInterval(tick);cd.parentElement.hidden=true;rs.hidden=false}},1000);
}
function startOtp(reg,to){
 mode=reg?'reg':'log';oForm.querySelector('.to').textContent=to;
 bx.forEach(b=>b.value='');om.textContent='';
 card.classList.add('otp');q('.f-reg').inert=true;q('.f-log').inert=true;oForm.inert=false;
 count();setTimeout(()=>bx[0].focus(),450);
}
bx.forEach((b,i)=>{
 b.addEventListener('input',()=>{b.value=b.value.replace(/\D/g,'').slice(-1);if(b.value&&bx[i+1])bx[i+1].focus()});
 b.addEventListener('keydown',e=>{if(e.key==='Backspace'&&!b.value&&bx[i-1])bx[i-1].focus()});
 b.addEventListener('focus',()=>b.select());
 b.addEventListener('paste',e=>{
  e.preventDefault();
  const t=(e.clipboardData.getData('text')||'').replace(/\D/g,'').slice(0,6);
  [...t].forEach((c,k)=>{bx[k].value=c});
  if(t)bx[Math.min(t.length,5)].focus();
 });
});
oForm.addEventListener('submit',e=>{
 e.preventDefault();
 const c=bx.map(b=>b.value).join('');
 const err=c.length<6?'Enter the 6-digit code':c!=='123456'?'Incorrect code, try again':'';
 om.className='msg '+(err?'err':'ok');
 om.textContent=err||(mode==='reg'?'Verified. Account created (demo)':'Verified. Logged in (demo)');
 if(!err)clearInterval(tick);
});
rs.addEventListener('click',()=>{count();om.className='msg ok';om.textContent='A new code was sent (demo)'});
oForm.querySelector('.back').addEventListener('click',show);
</script>
</body>
</html>
