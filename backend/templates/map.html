{% extends "base.html" %}
{% block title %}خريطة الجودة{% endblock %}
{% block head %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
{% endblock %}
{% block content %}
<section class="panel flat">
  <h1>خريطة جودة الشبكة</h1>
  <p class="muted">خلايا مجمّعة داخل حدود حائل — بدون إحداثيات فردية.</p>
  <div id="map" class="map"></div>
  <div id="legend" class="legend"></div>
</section>
{% endblock %}
{% block scripts %}
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const BOUNDS = {{ bounds|tojson }};
const COLORS = {{ colors|tojson }};
const TOKEN = {{ token|tojson }};
const map = L.map('map').setView([(BOUNDS[1]+BOUNDS[3])/2, (BOUNDS[0]+BOUNDS[2])/2], 11);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
  maxZoom: 19
}).addTo(map);
map.setMaxBounds([[BOUNDS[1]-0.05, BOUNDS[0]-0.05],[BOUNDS[3]+0.05, BOUNDS[2]+0.05]]);
const headers = TOKEN ? {'Authorization': 'Bearer ' + TOKEN} : {};
fetch('/api/network-heatmap', {headers}).then(r => r.json()).then(data => {
  const legend = document.getElementById('legend');
  legend.innerHTML = Object.entries(COLORS).map(([k,v]) =>
    `<span><i style="background:${v}"></i>${k}</span>`).join('');
  (data.cells || []).forEach(cell => {
    const b = cell.bounds; // [west,south,east,north]
    const q = (cell.quality && cell.quality.download) || cell.status || 'insufficient';
    const color = COLORS[q] || COLORS.insufficient;
    L.rectangle([[b[1], b[0]],[b[3], b[2]]], {
      color, weight: 1, fillColor: color, fillOpacity: 0.45
    }).bindPopup(`${cell.id}<br>الحالة: ${cell.status}<br>عينات: ${cell.sample_count ?? '—'}`).addTo(map);
  });
}).catch(err => {
  document.getElementById('legend').textContent = 'تعذر تحميل الخريطة: ' + err;
});
</script>
{% endblock %}
