services:
  - type: web
    name: net
    runtime: docker
    # Free plan cannot attach a disk — SQLite is wiped on every deploy/spin-down.
    # Starter (or any paid plan) is required for /var/data persistence.
    plan: starter
    healthCheckPath: /api/network-config
    disk:
      name: smartcare-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: SMARTCARE_SPEED_ENABLED
        value: "1"
      - key: SMARTCARE_PUBLIC_ORIGIN
        value: https://net-71nf.onrender.com
      - key: SMARTCARE_CORS
        value: https://net-71nf.onrender.com,http://localhost:8080,http://127.0.0.1:8080
      - key: SMARTCARE_DB
        value: /var/data/smartcare.sqlite3
      - key: SMARTCARE_ADMIN_PHONE
        value: "0552515874"
      - key: SMARTCARE_ADMIN_PASSWORD
        value: "123456"
      # Generated once; do not rotate on each deploy (would invalidate web cookies).
      - key: SMARTCARE_SECRET
        generateValue: true
      - key: SMARTCARE_GEMINI_API_KEY
        sync: false
